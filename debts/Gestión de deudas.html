.neg{color:var(--bad)}.pos{color:var(--ac)}

input[type=range]{width:100%;accent-color:var(--ac)}

.note{color:var(--mut);font-size:.82rem;margin-top:10px}
.stp{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px}.stp button{min-width:36px;height:36px;border:1px solid var(--bd);background:var(--bg);border-radius:8px;font-size:1.1rem;cursor:pointer}.stp button:disabled{opacity:.45;cursor:default}.stp input{width:84px;text-align:center}.sm{background:none;border:1px solid var(--bd);border-radius:8px;padding:3px 10px;cursor:pointer;color:var(--mut);font-size:.8rem;text-transform:none;letter-spacing:0}.main{flex:1;font-size:.85rem!important;color:var(--tx)}
input.fi{width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
</style>
</head>

const stp=(k,l,v,u)=>`<div class="card"><div class="lbl">${l}</div><div class="stp"><button data-a="${k}" data-d="-1" aria-label="-">−</button><input type="number" data-in="${k}" value="${v}" step="${k==="tar"?.25:1}" min="0"><button data-a="${k}" data-d="1" aria-label="+">+</button><span class="lbl">${u}</span></div></div>`;
function incView(){const usd=S.hrs*S.tar,gross=usd*S.rate,fee=Math.min(gross,gross*S.fp/100+S.ff*S.rate),net=gross-fee,XT=X.reduce((a,x)=>a+x.a,0),cop=net+XT,gap=cop-G,mx=Math.max(cop,G);
const msg=S.live?`${t("live")}${S.at?" · "+t("upd")+" "+new Date(S.at).toLocaleTimeString(S.lang,{hour:"2-digit",minute:"2-digit"}):""}`:t("man");
const er=S.err==="needs_reauth"||S.err==="server_not_connected"?t("re"):S.err==="approval_required"||S.err==="not_in_manifest"?t("ap"):S.err?t("er"):"";
return `<h2>${t("inc")}</h2><div class="grid"><div class="card"><div class="lbl">${t("hrs")}</div><div class="stp"><button data-a="hrs" data-d="-1" aria-label="-">−</button><input type="number" data-in="hrs" value="${S.dh}" step="0.5" min="0"><button data-a="hrs" data-d="1" aria-label="+">+</button><span class="lbl">h</span></div><div class="stp"><button class="main" data-a="hsave" ${S.dh===S.hrs?"disabled":""}>${t("sv")}</button></div><div class="note">${S.dh===S.hrs?t("sd")+": "+S.hrs+" h":t("ns")}</div></div>${stp("tar",t("tar"),S.tar,"USD/h")}${[[t("usd"),"USD "+usd.toLocaleString("es-CO")],[t("cg"),f(gross)],[t("fe"),"-"+f(fee)],[t("cn2"),f(net)],[t("xt"),"+"+f(XT)],[t("tb"),f(cop)]].map(([l,v])=>`<div class="card"><div class="lbl">${l}</div><div class="big">${v}</div></div>`).join("")}</div>
<div class="note">${S.hrs} h × USD ${S.tar} = USD ${usd.toLocaleString("es-CO")} → ${f(gross)} − ${f(fee)} = ${f(net)}${XT?` + ${f(XT)} = ${f(cop)}`:""} </div><h2>${t("xs")} <button class="sm" data-a="xadd">+ ${t("xa")}</button></h2>${X.length?`<div class="grid">${X.map((x,i)=>`<div class="card"><label class="lbl" style="display:block">${t("nm")}<input class="fi" type="text" data-x="n" data-i="${i}" value="${esc(x.n)}"></label><label class="lbl" style="display:block;margin-top:12px">${t("xm")}<input class="fi" type="number" data-x="a" data-i="${i}" value="${x.a}" min="0" step="10000"></label><div class="stp"><button data-a="xdel" data-i="${i}" aria-label="${t("del")}" style="color:var(--bad)">🗑</button></div></div>`).join("")}</div>`:`<div class="note">${t("xe")}</div>`}<div class="note">${t("xnote")}</div><h2>${t("pf")}</h2><div class="grid"><div class="card"><div class="lbl">${t("pp")}</div><div class="stp"><input type="number" data-in="fp" value="${S.fp}" step="0.1" min="0"><span class="lbl">%</span></div></div><div class="card"><div class="lbl">${t("pu")}</div><div class="stp"><input type="number" data-in="ff" value="${S.ff}" step="0.5" min="0"><span class="lbl">USD</span></div></div></div><div class="note">${t("pn")}</div><h2>${t("rate")}</h2><div class="card"><div class="big">$${S.rate.toLocaleString("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div style="margin-top:8px"><span class="pill ${S.live?"live":""}"><span class="dot"></span>${msg}</span></div>
${S.live?"":`<div style="margin-top:12px"><label class="lbl">${t("mr")} </label><input type="number" id="mr" value="${S.rate}" step="1" min="1"></div>`}${er?`<div class="note">${er}</div>`:""}</div>
<h2>${t("cmp")}</h2><div class="card"><div class="row"><span>${t("inb")}</span><b>${f(cop)}</b></div><div class="bar"><i style="width:${cop/mx*100}%"></i></div><div class="row"><span>${t("outb")}</span><b>${f(G)}</b></div><div class="bar"><i style="width:${G/mx*100}%;background:var(--bad)"></i></div><div class="row"><span>${t("mp")}</span><b>${f(T.c)}</b></div><div class="row"><span>${t("bas")}</span><b>${f(BT())}</b></div><div class="row"><span>${t("gap")}</span><b class="${gap<0?"neg":"pos"}">${gap<0?"-":""}${f(Math.abs(gap))}</b></div></div>
`}
function render(){calc();document.documentElement.lang=S.lang;$("ttl").textContent=t("ttl");$("n1").textContent=t("n1");$("n2").textContent=t("n2");$("n3").textContent=t("n3");$("n4").textContent=t("n4");document.documentElement.dataset.theme=S.theme;$("th").textContent=S.theme==="dark"?"☀":"☾";
$("n1").className=S.tab===1?"on":"";$("n2").className=S.tab===2?"on":"";$("n3").className=S.tab===3?"on":"";$("n4").className=S.tab===4?"on":"";$("app").innerHTML=[debtsView,payView,incView,basView][S.tab-1]();
const ex=$("ex");if(ex)ex.onchange=e=>{S.extra=+e.target.value;render()};
const mr=$("mr");if(mr)mr.onchange=e=>{const v=parseFloat(e.target.value);if(v>0){S.rate=v;render()}}}
$("app").onclick=e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,d=+b.dataset.d,i=+b.dataset.i;if(a==="hrs"){S.dh=Math.max(0,+(S.dh+d).toFixed(2))}else if(a==="hsave"){S.hrs=S.dh}else if(a==="tar"){S.tar=Math.max(0,+(S.tar+d*.25).toFixed(2));S.tarMan=true}else if(a==="paid"){const x=D[i];x.p=Math.min(x.k,Math.max(0,x.p+d))}else if(a==="rstp"){D.splice(0,D.length,...JSON.parse(JSON.stringify(D0)));S.edit=-1}else if(a==="edit"){S.edit=S.edit===i?-1:i}else if(a==="del"){D.splice(i,1);S.edit=-1}else if(a==="xadd"){X.push({n:t("xn"),a:0})}else if(a==="xdel"){X.splice(i,1)}else if(a==="badd"){B.push({n:t("badd"),a:0})}else if(a==="bdel"){B.splice(i,1)}else if(a==="brst"){B.splice(0,B.length,...JSON.parse(JSON.stringify(B0)))}else if(a==="add"){D.push(clean({n:t("add"),c:100000,k:12,t:1200000,p:0,d:15}));S.edit=D.length-1}else if(a==="use"){S.hrsMan=S.tarMan=false}save();render()};
$("app").onchange=e=>{const xf=e.target.dataset.x;if(xf){const x=X[+e.target.dataset.i];if(!x)return;if(xf==="n")x.n=e.target.value.slice(0,40)||"—";else{const v=parseFloat(e.target.value);if(!(v>=0))return;x.a=v}save();render();return}const bf=e.target.dataset.b;if(bf){const x=B[+e.target.dataset.i];if(!x)return;if(bf==="n")x.n=e.target.value.slice(0,40)||"—";else{const v=parseFloat(e.target.value);if(!(v>=0))return;x.a=v}save();render();return}const fd=e.target.dataset.f;if(fd){const x=D[+e.target.dataset.i];if(!x)return;if(fd==="n")x.n=e.target.value.slice(0,40)||"—";else{const v=parseFloat(e.target.value);if(!(v>=0))return;x[fd]=v}Object.assign(x,clean(x));save();return}const k=e.target.dataset.in;if(!k)return;const v=parseFloat(e.target.value);if(!(v>=0))return;if(k==="hrs"){S.dh=v}else if(k==="fp"||k==="ff"){S[k]=v}else{S.tar=v;S.tarMan=true}save();render()};
$("n1").onclick=()=>{S.tab=1;render()};$("n2").onclick=()=>{S.tab=2;render()};$("n3").onclick=()=>{S.tab=3;render()};$("n4").onclick=()=>{S.tab=4;render()};$("th").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";try{localStorage.setItem("gd-theme",S.theme)}catch(e){}render()};$("lg").onclick=()=>{S.lang=S.lang==="es"?"en":"es";render()};
render();
(async()=>{try{const c=window.claude&&await window.claude.use("mcp");if(!c)return;let alt=false;
const go=()=>c.watchTool("Google Sheets","get_values",alt?{spreadsheet_id:ID,range:RNG}:{spreadsheetId:ID,range:RNG},ev=>{
if(ev.type==="data"){let p=ev.result.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}const v=p&&p.values;if(!v)return;
const r=num(v[2]&&v[2][1]),ta=num(v[0]&&v[0][1]),h=num(v[4]&&v[4][1]);
if(r>0){S.rate=r;S.live=true;S.err="";S.at=(ev.result.cache&&ev.result.cache.storedAt)||Date.now()}render()}
else{S.err=ev.error.code;if(["needs_reauth","server_not_connected","approval_required","not_in_manifest"].includes(S.err))S.live=false;render()}},{refetchInterval:60000});
go()}catch(e){}})();
</script>
</body>
